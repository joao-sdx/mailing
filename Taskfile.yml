version: "3"

vars:
  MVN: "./mvnw"
  JAR: "crm-back/target/crm-back-1.0-SNAPSHOT.jar"

tasks:
  build:
    desc: Build crm-front (Svelte) and crm-back (fat JAR)
    cmd: "{{.MVN}} -pl crm-back -am clean package -DskipTests"

  run:
    desc: Run the crm-back fat JAR (builds first if JAR is missing)
    cmds:
      - task: build
      - java -jar {{.JAR}}

  front:
    desc: Build crm-front only
    cmd: "{{.MVN}} -pl crm-front clean package -DskipTests"

  back:
    desc: Build crm-back only (assumes crm-front JAR already installed)
    cmd: "{{.MVN}} -pl crm-back clean package -DskipTests"

  db:
    desc: Start local Postgres container (crm / crm / crm on port 5432)
    cmd: >-
      docker run -d --name crm-postgres
      -e POSTGRES_DB=crm
      -e POSTGRES_USER=crm
      -e POSTGRES_PASSWORD=crm
      -p 5432:5432
      postgres:17-alpine

  db-stop:
    desc: Stop and remove the crm-postgres container
    cmd: docker stop crm-postgres && docker rm crm-postgres

  clean:
    desc: Clean all modules
    cmd: "{{.MVN}} clean"
