services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ESPOCRM_DB_NAME}
      MYSQL_USER: ${ESPOCRM_DB_USER}
      MYSQL_PASSWORD: ${ESPOCRM_DB_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  espocrm:
    image: espocrm/espocrm:latest
    restart: unless-stopped
    ports:
      - "${ESPOCRM_PORT:-8080}:80"
    environment:
      ESPOCRM_DATABASE_HOST: mysql
      ESPOCRM_DATABASE_NAME: ${ESPOCRM_DB_NAME}
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USER}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL:-http://localhost:8080}
    volumes:
      - ./data/espocrm:/var/www/html/data
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
      - /var/log/apache2
    depends_on:
      mysql:
        condition: service_healthy

  espocrm-daemon:
    image: espocrm/espocrm:latest
    restart: unless-stopped
    entrypoint: docker-daemon.sh
    volumes:
      - ./data/espocrm:/var/www/html/data
    tmpfs:
      - /tmp
      - /var/run
      - /var/log
    depends_on:
      - espocrm