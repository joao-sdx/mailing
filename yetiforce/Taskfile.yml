version: "3"

dotenv: [ ".env" ]

vars:
  BASE_URL: "{{.CRM_URL}}/webservice/WebserviceStandard"
  AUTH: "{{.WS_APP_NAME}}:{{.WS_APP_PASS}}"
  TOKEN_FILE: ".token"

tasks:
  login:
    desc: Authenticate and store session token in .token
    cmd: |
      RESPONSE=$(http --print=b --auth "{{.AUTH}}" POST "{{.BASE_URL}}/Users/Login" \
        "X-API-KEY:{{.WS_API_KEY}}" \
        userName="{{.WS_USER_NAME}}" \
        password="{{.WS_USER_PASS}}")
      echo "$RESPONSE"
      TOKEN=$(echo "$RESPONSE" | jq -r '.result.token // empty')
      if [ -z "$TOKEN" ]; then
        echo "ERROR: login failed, token not found in response"
        exit 1
      fi
      echo "$TOKEN" > {{.TOKEN_FILE}}
      echo "token saved to {{.TOKEN_FILE}}"

  get-contact:
    desc: "Get a contact by ID. Usage: task get-contact ID=167"
    cmd: |
      http --auth "{{.AUTH}}" GET "{{.BASE_URL}}/Contacts/Record/{{.ID}}" \
        "X-API-KEY:{{.WS_API_KEY}}" \
        "X-TOKEN:$(cat {{.TOKEN_FILE}})" \
        "x-raw-data:1"

  get-lead:
    desc: "Get a lead by ID. Usage: task get-lead ID=162"
    cmd: |
      http --auth "{{.AUTH}}" GET "{{.BASE_URL}}/Leads/Record/{{.ID}}" \
        "X-API-KEY:{{.WS_API_KEY}}" \
        "X-TOKEN:$(cat {{.TOKEN_FILE}})" \
        "x-raw-data:1"

  list-accounts:
    desc: List all accounts (first 100)
    cmd: |
      http --auth "{{.AUTH}}" GET "{{.BASE_URL}}/Accounts/RecordsList" \
        "X-API-KEY:{{.WS_API_KEY}}" \
        "X-TOKEN:$(cat {{.TOKEN_FILE}})" \
        "x-raw-data:1" \
        "x-row-limit:100" \
        "x-row-offset:0"

  check-service-contracts:
    desc: "Check service contracts for an account. Usage: task check-service-contracts ACCOUNT_ID=118"
    cmd: |
      http --auth "{{.AUTH}}" GET "{{.BASE_URL}}/Accounts/RecordRelatedList/{{.ACCOUNT_ID}}/ServiceContracts" \
        "X-API-KEY:{{.WS_API_KEY}}" \
        "X-TOKEN:$(cat {{.TOKEN_FILE}})" \
        "x-raw-data:1"
