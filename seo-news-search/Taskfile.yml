version: "3"

vars:
  MVN_EXEC: "../mvnw"

tasks:
  default:
    desc: Run the seo-news-search pipeline (writes .md files to output/)
    cmd: '{{.MVN_EXEC}} spring-boot:run'

  run:
    desc: "Run with custom input/output; pass INPUT_YML and OUTPUT_DIR"
    cmd: |
      {{.MVN_EXEC}} spring-boot:run \
        -Dspring-boot.run.arguments="--seo-news.input-yml={{.INPUT_YML}} --seo-news.output-dir={{.OUTPUT_DIR}}"
    requires:
      vars: [INPUT_YML, OUTPUT_DIR]

  build:
    desc: Build the jar
    cmd: "{{.MVN_EXEC}} package -DskipTests"

  test:
    desc: Run unit tests
    cmd: "{{.MVN_EXEC}} test"

  clean:
    desc: Remove build artifacts and output files
    cmds:
      - "{{.MVN_EXEC}} clean"
      - rm -rf output/
